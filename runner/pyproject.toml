[project]
name = "airlock-runner"
version = "0.1.0"
description = "Airlock sandbox runner: the only service on the sandbox VM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "docker>=7.1,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27,<1",
    # sandbox libs so the DEV-ONLY subprocess backend can run programs locally
    "pdfplumber>=0.11,<0.12",
    "pypdf>=5,<6",
    "rapidfuzz>=3.10,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
