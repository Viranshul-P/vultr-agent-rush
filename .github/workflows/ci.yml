name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: API tests
        working-directory: api
        run: uv sync && uv run pytest -q

      - name: Runner tests
        working-directory: runner
        run: uv sync && uv run pytest -q

      - name: Guard — every LLM call must go through Vultr Serverless Inference
        run: |
          set -e
          # Fail if any non-Vultr LLM base URL appears outside tests/docs.
          if grep -rEn "api\.(openai|anthropic)\.com|generativelanguage\.googleapis|\.openai\.azure\.com" \
               --include=*.py api/airlock_api runner/airlock_runner; then
            echo "::error::found a non-Vultr LLM endpoint"; exit 1
          fi
          grep -q "api.vultrinference.com" api/airlock_api/config.py || { echo "::error::Vultr inference base URL missing"; exit 1; }
          echo "LLM endpoint guard passed."

      - name: Web build
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
